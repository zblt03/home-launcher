<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 28px sans-serif; }
  #msg { padding: 60px; }
</style>
</head>
<body>
<div id="msg">Abriendo Home…</div>
<script>
  // Lanza la app Home instalada en la TV; este módulo no contiene nada más.
  var HOME_ID = "HkTvHome01.Home";
  function fail(text) { document.getElementById("msg").textContent = text; }
  try {
    tizen.application.launch(HOME_ID, function () {}, function (e) { fail("No se pudo abrir Home: " + e.message); });
  } catch (e) {
    fail("No se pudo abrir Home: " + e.message);
  }
</script>
</body>
</html>
